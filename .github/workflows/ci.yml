name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ESPHome Compile
    # The compiler lock supports Linux only; otherwise use hosted Ubuntu.
    runs-on: ${{ fromJSON(contains(fromJSON(vars.CI_RUNNER_LABELS || '[]'), 'linux') && (vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - patterns/ble-temp-sensor/generic-ble-temp.yaml
          - patterns/ble-temp-sensor/inkbird-ibs-th1.yaml
          - patterns/ble-temp-sensor/xiaomi-lywsd03mmc.yaml
          - patterns/daly-bms/multi-bms.yaml
          - patterns/daly-bms/single-bms.yaml
          - patterns/jbd-bms/multi-bms.yaml
          - patterns/jbd-bms/single-bms.yaml
          - patterns/xiaomi-mi-flora/mi-flora.yaml
        esphome: ['2026.10.0b1']

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          python scripts/install-esphome.py

      - name: Compile with the local adapter and isolated dummy credentials
        env:
          CONFIG: ${{ matrix.pattern }}
        run: bash scripts/ci.sh compile "$CONFIG"

    timeout-minutes: 30
  lint:
    name: Lint
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-lint.txt

      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yml .

      - name: Check GitHub Actions syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

    timeout-minutes: 30
  validate-structure:
    name: Validate Structure
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check required files
        run: |
          # Verify each pattern has required files
          shopt -s nullglob
          for p in patterns/*/; do
            name=$(basename "$p")
            echo "Checking $name..."
            [[ -f "${p}README.md" ]] || { echo "Missing README.md in $p"; exit 1; }
            [[ -f "${p}secrets.example.yaml" ]] || { echo "Missing secrets.example.yaml in $p"; exit 1; }
            # At least one YAML config
            configs=("${p}"*.yaml)
            [[ ${#configs[@]} -gt 0 ]] || { echo "No YAML config in $p"; exit 1; }
          done

      - name: Check common files
        run: |
          [[ -f "patterns/common/esp32-ble-config.yaml" ]] || exit 1
          [[ -f "patterns/common/ble-client-template.yaml" ]] || exit 1
          [[ -f "patterns/common/mqtt-template.yaml" ]] || exit 1
          [[ -f "comparison/ble-vs-uart-vs-can.md" ]] || exit 1

    timeout-minutes: 30
  summary:
    name: Summary
    permissions: {}
    needs: [compile, lint, validate-structure]
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check job statuses
        run: |
          if [[ "${{ needs.compile.result }}" != "success" ]]; then
            echo "❌ Compile failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.validate-structure.result }}" != "success" ]]; then
            echo "❌ Structure validation failed"
            exit 1
          fi
          echo "✅ All checks passed"
    timeout-minutes: 30
