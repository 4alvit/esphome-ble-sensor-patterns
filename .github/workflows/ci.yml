name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  compile:
    name: ESPHome Compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - patterns/jbd-bms/single-bms.yaml
          - patterns/jbd-bms/multi-bms.yaml
          - patterns/ble-temp-sensor/inkbird-ibs-th1.yaml
        esphome: ['2025.11.0']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install "esphome==${{ matrix.esphome }}"

      - name: Compile with the local adapter and isolated dummy credentials
        env:
          CONFIG: ${{ matrix.pattern }}
        run: bash scripts/ci.sh compile "$CONFIG"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yml .

      - name: Check GitHub Actions syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  validate-structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check required files
        run: |
          # Verify each pattern has required files
          shopt -s nullglob
          for p in patterns/*/; do
            name=$(basename "$p")
            echo "Checking $name..."
            [[ -f "${p}README.md" ]] || { echo "Missing README.md in $p"; exit 1; }
            [[ -f "${p}secrets.example.yaml" ]] || { echo "Missing secrets.example.yaml in $p"; exit 1; }
            # At least one YAML config
            configs=("${p}"*.yaml)
            [[ ${#configs[@]} -gt 0 ]] || { echo "No YAML config in $p"; exit 1; }
          done

      - name: Check common files
        run: |
          [[ -f "patterns/common/esp32-ble-config.yaml" ]] || exit 1
          [[ -f "patterns/common/ble-client-template.yaml" ]] || exit 1
          [[ -f "patterns/common/mqtt-template.yaml" ]] || exit 1
          [[ -f "comparison/ble-vs-uart-vs-can.md" ]] || exit 1

  summary:
    name: Summary
    needs: [compile, lint, validate-structure]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.compile.result }}" != "success" ]]; then
            echo "❌ Compile failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.validate-structure.result }}" != "success" ]]; then
            echo "❌ Structure validation failed"
            exit 1
          fi
          echo "✅ All checks passed"
