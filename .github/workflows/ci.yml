name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: ESPHome Compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - patterns/jbd-bms/single-bms.yaml
          - patterns/jbd-bms/multi-bms.yaml
          - patterns/daly-bms/single-bms.yaml
          - patterns/daly-bms/multi-bms.yaml
          - patterns/ble-temp-sensor/inkbird-ibs-th1.yaml
          - patterns/ble-temp-sensor/xiaomi-lywsd03mmc.yaml
        esphome: ['2025.11.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git for external components
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install "esphome==${{ matrix.esphome }}"

      - name: Create dummy secrets
        run: |
          # Create secrets.yaml from secrets.example.yaml with dummy values for CI
          for f in patterns/*/secrets.example.yaml; do
            dir=$(dirname "$f")
            if [[ ! -f "$dir/secrets.yaml" ]]; then
              cp "$f" "$dir/secrets.yaml"
              # Replace placeholder VALUES with dummy values
              # WiFi
              sed -i 's/your-ssid/dummy_ssid/g' "$dir/secrets.yaml"
              sed -i 's/your-wifi-ssid/dummy_ssid/g' "$dir/secrets.yaml"
              sed -i 's/your_wifi_ssid/dummy_ssid/g' "$dir/secrets.yaml"
              sed -i 's/your-password/dummy_password/g' "$dir/secrets.yaml"
              sed -i 's/your-wifi-password/dummy_password/g' "$dir/secrets.yaml"
              sed -i 's/your_wifi_password/dummy_password/g' "$dir/secrets.yaml"
              # MQTT host/port
              sed -i 's/192.168.1.100/localhost/g' "$dir/secrets.yaml"
              sed -i 's/mqtt\.local/localhost/g' "$dir/secrets.yaml"
              # Note: 1883 stays as 1883
              # MQTT username/password (replace VALUES, not keys)
              sed -i 's/mqtt-user/dummy_user/g' "$dir/secrets.yaml"
              sed -i 's/mqtt_username/dummy_user/g' "$dir/secrets.yaml"
              sed -i 's/mqtt-password/dummy_pass/g' "$dir/secrets.yaml"
              sed -i 's/mqtt_password/dummy_pass/g' "$dir/secrets.yaml"
              # OTA
              sed -i 's/ota-password/dummy_ota_pass/g' "$dir/secrets.yaml"
              # MAC addresses
              sed -i 's/C4:7C:8D:XX:XX:XX/AA:BB:CC:DD:EE:FF/g' "$dir/secrets.yaml"
              sed -i 's/A4:C1:38:XX:XX:XX/AA:BB:CC:DD:EE:FF/g' "$dir/secrets.yaml"
              sed -i 's/daly_bms1_mac/AA:BB:CC:DD:EE:01/g' "$dir/secrets.yaml"
              sed -i 's/daly_bms2_mac/AA:BB:CC:DD:EE:02/g' "$dir/secrets.yaml"
              sed -i 's/daly_bms3_mac/AA:BB:CC:DD:EE:03/g' "$dir/secrets.yaml"
              sed -i 's/mi_flora_mac/AA:BB:CC:DD:EE:FF/g' "$dir/secrets.yaml"
              # Xiaomi bindkey
              sed -i 's/0123456789abcdef0123456789abcdef/dummy_bindkey/g' "$dir/secrets.yaml"
              # Govee key
              sed -i 's/0123456789abcdef/dummy_govee_key/g' "$dir/secrets.yaml"
              # Captive portal
              sed -i 's/portal-password/dummy_portal_pass/g' "$dir/secrets.yaml"
            fi
          done

      - name: Compile pattern
        run: |
          echo "Compiling ${{ matrix.pattern }} with ESPHome ${{ matrix.esphome }}"
          esphome compile ${{ matrix.pattern }} || exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: |
          yamllint -c .yamllint.yml .

      - name: Check GitHub Actions syntax
        run: |
          # Validate workflow files
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            gh workflow lint $f 2>/dev/null || true
          done

  validate-structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          # Verify each pattern has required files
          for p in patterns/*/; do
            name=$(basename "$p")
            echo "Checking $name..."
            [[ -f "${p}README.md" ]] || { echo "Missing README.md in $p"; exit 1; }
            [[ -f "${p}secrets.example.yaml" ]] || { echo "Missing secrets.example.yaml in $p"; exit 1; }
            # At least one YAML config
            [[ $(ls "${p}"*.yaml 2>/dev/null | wc -l) -gt 0 ]] || { echo "No YAML config in $p"; exit 1; }
          done

      - name: Check common files
        run: |
          [[ -f "patterns/common/esp32-ble-config.yaml" ]] || exit 1
          [[ -f "patterns/common/ble-client-template.yaml" ]] || exit 1
          [[ -f "patterns/common/mqtt-template.yaml" ]] || exit 1
          [[ -f "comparison/ble-vs-uart-vs-can.md" ]] || exit 1

  summary:
    name: Summary
    needs: [compile, lint, validate-structure]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.compile.result }}" != "success" ]]; then
            echo "❌ Compile failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"
            exit 1
          fi
          if [[ "${{ needs.validate-structure.result }}" != "success" ]]; then
            echo "❌ Structure validation failed"
            exit 1
          fi
          echo "✅ All checks passed"
