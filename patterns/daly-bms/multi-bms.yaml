# Daly BMS Multi-BMS Event-Driven Configuration
# Sequential connect/disconnect for multiple Daly BMS devices

esphome:
  name: daly-bms-multi
  friendly_name: "Daly BMS Multi"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ACL_CONNECTIONS: "9"
      CONFIG_BT_GATTC_CONNECT_RETRY_COUNT: "3"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

esp32_ble:
  max_connections: 8

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: battery/daly

logger:
  level: INFO
  logs:
    daly_bms_ble: WARN

api:
  reboot_timeout: 0s

ota:
  platform: esphome

web_server:
  port: 80

external_components:
  - source: github://syssi/esphome-daly-bms@main
    refresh: 1d
    components: [daly_bms_ble]

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 800ms
    window: 400ms
    active: false
    continuous: true

ble_client:
  # BMS 1
  - mac_address: !secret daly_bms1_mac
    id: daly_bms1_client
    auto_connect: false
    on_connect:
      then:
        - logger.log: "Daly BMS1 connected"
        - delay: 1s
        - lambda: 'id(daly_bms1).update();'
        - delay: 4s
        - ble_client.disconnect: daly_bms1_client

  # BMS 2
  - mac_address: !secret daly_bms2_mac
    id: daly_bms2_client
    auto_connect: false
    on_connect:
      then:
        - logger.log: "Daly BMS2 connected"
        - delay: 1s
        - lambda: 'id(daly_bms2).update();'
        - delay: 4s
        - ble_client.disconnect: daly_bms2_client

  # BMS 3
  - mac_address: !secret daly_bms3_mac
    id: daly_bms3_client
    auto_connect: false
    on_connect:
      then:
        - logger.log: "Daly BMS3 connected"
        - delay: 1s
        - lambda: 'id(daly_bms3).update();'
        - delay: 4s
        - ble_client.disconnect: daly_bms3_client

daly_bms_ble:
  - id: daly_bms1
    ble_client_id: daly_bms1_client
    update_interval: never
  - id: daly_bms2
    ble_client_id: daly_bms2_client
    update_interval: never
  - id: daly_bms3
    ble_client_id: daly_bms3_client
    update_interval: never

sensor:
  # BMS 1
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms1
    total_voltage:
      name: "BMS1 Pack Voltage"
    current:
      name: "BMS1 Current"
    state_of_charge:
      name: "BMS1 SOC"
    temperature_1:
      name: "BMS1 Temp 1"
    temperature_2:
      name: "BMS1 Temp 2"
    cell_voltage_1:
      name: "BMS1 Cell 1"
    cell_voltage_2:
      name: "BMS1 Cell 2"
    cell_voltage_3:
      name: "BMS1 Cell 3"
    cell_voltage_4:
      name: "BMS1 Cell 4"

  # BMS 2
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms2
    total_voltage:
      name: "BMS2 Pack Voltage"
    current:
      name: "BMS2 Current"
    state_of_charge:
      name: "BMS2 SOC"
    temperature_1:
      name: "BMS2 Temp 1"
    cell_voltage_1:
      name: "BMS2 Cell 1"
    cell_voltage_2:
      name: "BMS2 Cell 2"
    cell_voltage_3:
      name: "BMS2 Cell 3"
    cell_voltage_4:
      name: "BMS2 Cell 4"

  # BMS 3
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms3
    total_voltage:
      name: "BMS3 Pack Voltage"
    current:
      name: "BMS3 Current"
    state_of_charge:
      name: "BMS3 SOC"
    temperature_1:
      name: "BMS3 Temp 1"
    cell_voltage_1:
      name: "BMS3 Cell 1"
    cell_voltage_2:
      name: "BMS3 Cell 2"
    cell_voltage_3:
      name: "BMS3 Cell 3"
    cell_voltage_4:
      name: "BMS3 Cell 4"

  # Status
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms1
    charging:
      name: "BMS1 Charging"
    discharging:
      name: "BMS1 Discharging"
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms2
    charging:
      name: "BMS2 Charging"
    discharging:
      name: "BMS2 Discharging"
  - platform: daly_bms_ble
    daly_bms_ble_id: daly_bms3
    charging:
      name: "BMS3 Charging"
    discharging:
      name: "BMS3 Discharging"
  - platform: status
    name: "ESP32 Status"

globals:
  - id: current_bms_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: ble_busy
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 30s
    then:
      - esp32_ble_tracker.stop_scan:
          id: ble_tracker
      - lambda: |-
          if (id(ble_busy)) {
            id(ble_busy) = false;
          }
      - if:
          condition:
            lambda: 'return !id(ble_busy);'
          then:
            - lambda: |-
                id(ble_busy) = true;
                id(current_bms_index) = (id(current_bms_index) + 1) % 3;
                ESP_LOGI("cycle", "Polling Daly BMS %d", id(current_bms_index) + 1);
            - delay: 1s
            - esp32_ble_tracker.start_scan:
                id: ble_tracker
            - delay: 1s
            - if:
                condition:
                  lambda: 'return id(current_bms_index) == 0;'
                then:
                  - ble_client.connect: daly_bms1_client
            - if:
                condition:
                  lambda: 'return id(current_bms_index) == 1;'
                then:
                  - ble_client.connect: daly_bms2_client
            - if:
                condition:
                  lambda: 'return id(current_bms_index) == 2;'
                then:
                  - ble_client.connect: daly_bms3_client
            - delay: 15s
            - lambda: |-
                id(ble_busy) = false;
