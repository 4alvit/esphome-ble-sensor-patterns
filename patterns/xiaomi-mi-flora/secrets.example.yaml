# XIAOMI MI FLORA SECRETS
# Copy to secrets.yaml and fill in your values

wifi_ssid: "your_wifi_ssid"
wifi_pass: "your_wifi_password"

mqtt_host: "mqtt.local"
mqtt_port: "1883"
mqtt_user: "mqtt_username"
mqtt_pass: "mqtt_password"

# Mi Flora MAC address (format: C4:7C:8D:XX:XX:XX or A4:C1:38:XX:XX:XX)

# Required per-device 256-bit Noise key: openssl rand -base64 32
# Empty intentionally: configure privately before compiling for a real device.
api_encryption_key: ""

# Replace with your sensor MAC address.
mi_flora_mac: "AA:BB:CC:DD:EE:FF"
