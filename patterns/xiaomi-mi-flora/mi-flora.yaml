# Xiaomi Mi Flora / HHCCJCY01 Plant Sensor
# Soil moisture, fertility (conductivity), light, temperature, battery
# Uses the built-in passive parser; availability depends on sensor firmware.

esphome:
  name: xiaomi-mi-flora
  friendly_name: "Xiaomi Mi Flora"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass

captive_portal:

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: sensors/mi_flora

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Network OTA is disabled by default; see SECURITY.md before enabling updates.

# The optional HTTP management server is disabled by default.

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1600ms
    window: 30ms
    active: false
    continuous: true

sensor:
  # Use the built-in parser, which checks packet structure and device identity.
  - platform: xiaomi_hhccjcy01
    mac_address: !secret mi_flora_mac
    temperature:
      name: "Soil Temperature"
      id: temp_sensor
    moisture:
      name: "Soil Moisture"
      id: moisture_sensor
    conductivity:
      name: "Soil Fertility"
      id: fertility_sensor
    illuminance:
      name: "Light Intensity"
      id: light_sensor
    battery_level:
      name: "Battery"
      id: battery_sensor

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32 Status"
