# Generic BLE Temperature Sensor Pattern
# Template for any BLE temperature/humidity sensor using advertisements
# Works with passive BLE scanning (no connection needed)

esphome:
  name: ble-temp-generic
  friendly_name: "BLE Temperature Sensor"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  ap:
    ssid: "ble-temp-fallback"
    password: !secret wifi_pass

captive_portal:

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: sensors/ble_temp

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Network OTA is disabled by default; see SECURITY.md before enabling updates.

# The optional HTTP management server is disabled by default.

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false
    continuous: true

sensor:
  # Template: Define sensors and parse in lambda
  - platform: template
    name: "Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return NAN;  // Replace with actual parsed value

  - platform: template
    name: "Humidity"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return NAN;

  - platform: template
    name: "Battery"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return NAN;

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32 Status"
