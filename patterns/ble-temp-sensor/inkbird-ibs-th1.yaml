# Inkbird TH1 / TH1 Mini internal-sensor compatibility profile
# No claim of compatibility with other hardware revisions or models
# Passive BLE advertisement parsing (no connection needed)

esphome:
  includes:
    - inkbird_th1_parser.h
  name: inkbird-ibs-th1
  friendly_name: "Inkbird IBS-TH1"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass

captive_portal:

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: sensors/inkbird

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Network OTA is disabled by default; see SECURITY.md before enabling updates.

# The optional HTTP management server is disabled by default.

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1600ms
    window: 30ms
    active: false
    continuous: true

  # MAC selection is not authentication. See docs/inkbird-contract.md.
  on_ble_advertise:
    - mac_address: !secret inkbird_th1_mac
      then:
        - lambda: |-
            if (x.get_address_type() != esphome::ble_device_base::BLE_ADDR_TYPE_PUBLIC ||
                !x.get_service_datas().empty()) {
              return;
            }
            const auto &entries = x.get_manufacturer_datas();
            if (entries.size() != 1) {
              return;
            }
            const auto &entry = entries[0];
            if (entry.uuid.type() != esphome::ble_device_base::ESPBTUUID::Type::UUID16) {
              return;
            }
            ble_patterns::InkbirdReading reading{};
            if (!ble_patterns::decode_inkbird_th1_internal(
                    entry.uuid.uuid16(), entry.data.data(), entry.data.size(), reading)) {
              return;
            }
            id(sensor_temperature).publish_state(reading.temperature_hundredths / 100.0f);
            id(sensor_humidity).publish_state(reading.humidity_hundredths / 100.0f);
            id(sensor_battery).publish_state(reading.battery_percent);

sensor:
  - platform: template
    name: "Inkbird Temperature"
    id: sensor_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  - platform: template
    name: "Inkbird Humidity"
    id: sensor_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 2

  - platform: template
    name: "Inkbird Battery"
    id: sensor_battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32 Status"

# External-probe frames are intentionally rejected by this internal-only example.
