# Inkbird IBS-TH1 / IBS-TH2 / IBS-TH3
# Bluetooth thermometer/hygrometer with display
# Passive BLE advertisement parsing (no connection needed)

esphome:
  name: inkbird-ibs-th1
  friendly_name: "Inkbird IBS-TH1"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass

captive_portal:

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: sensors/inkbird

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  platform: esphome

web_server:
  port: 80

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1600ms
    window: 30ms
    active: false
    continuous: true

  on_ble_manufacturer_data_advertise:
    - manufacturer_id: "0x038A"  # Inkbird
      then:
        - lambda: |-
            std::string data = x.get_manufacturer_data();
            if (data.size() >= 11) {
              // IBS-TH1 format (manufacturer data)
              // Byte 0-1: manufacturer ID (0x8A03 little-endian)
              // Byte 2: frame type (0x2D for data)
              // Byte 3-4: temperature (int16, 0.01°C)
              // Byte 5: humidity (uint8, 1%)
              // Byte 6: battery (uint8, 0-100)
              // Byte 7-10: MAC address (reversed)
              if (data[2] == 0x2D) {
                int16_t temp_raw = int16_t(data[3] | (data[4] << 8));
                float temp = temp_raw / 100.0f;
                uint8_t hum = data[5];
                uint8_t bat = data[6];
                id(sensor_temperature).publish_state(temp);
                id(sensor_humidity).publish_state(hum);
                id(sensor_battery).publish_state(bat);
                ESP_LOGD("inkbird", "T=%.2f H=%u B=%u", temp, hum, bat);
              }
            }

sensor:
  - platform: template
    name: "Inkbird Temperature"
    id: sensor_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  - platform: template
    name: "Inkbird Humidity"
    id: sensor_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    name: "Inkbird Battery"
    id: sensor_battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32 Status"

# Alternative: Use Inkbird BLE component if interested in connection
# esp32_ble_client for active polling (not needed for passive scan)
