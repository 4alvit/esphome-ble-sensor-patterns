# Xiaomi Mijia BT Thermometer 2 (LYWSD03MMC)
# Encrypted BLE advertisements (AES-CCM) - requires bindkey
# Uses ESPHome built-in xiaomi_lywsd03mmc sensor support.

esphome:
  name: xiaomi-lywsd03mmc
  friendly_name: "Xiaomi LYWSD03MMC"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ACL_CONNECTIONS: "3"
      CONFIG_BT_GATTC_CONNECT_RETRY_COUNT: "3"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  ap:
    ssid: "lywsd03mmc-fallback"
    password: !secret wifi_pass

captive_portal:

mqtt:
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_pass
  topic_prefix: sensors/lywsd03mmc

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Network OTA is disabled by default; see SECURITY.md before enabling updates.

# The optional HTTP management server is disabled by default.

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1600ms
    window: 30ms
    active: false
    continuous: true


sensor:
  - platform: xiaomi_lywsd03mmc
    mac_address: !secret xiaomi_lywsd03mmc_mac
    bindkey: !secret xiaomi_lywsd03mmc_bindkey
    temperature:
      name: "Temperature"
      id: temp
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      id: hum
      accuracy_decimals: 1
    battery_level:
      name: "Battery"
      id: battery
      accuracy_decimals: 0

  # ESP32 Status
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "ESP32 Status"

button:
  - platform: restart
    name: "Restart"
