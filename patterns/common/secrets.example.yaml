# Copy to secrets.yaml and fill in your values
# DO NOT COMMIT secrets.yaml to git!

# WiFi
wifi_ssid: "your-ssid"
wifi_pass: "your-password"

# MQTT
mqtt_broker: "192.168.1.100"
mqtt_port: "1883"
mqtt_user: "mqtt-user"
mqtt_pass: "mqtt-password"
mqtt_topic_prefix: "sensors"

# BLE Encryption Keys (for encrypted sensors like Xiaomi)
# xiaomi_lywsd03mmc_bindkey: "0123456789abcdef0123456789abcdef"
# govee_h5075_key: "0123456789abcdef"

# OTA
ota_password: "ota-password"

# Optional: Captive Portal
captive_portal_password: "portal-password"
